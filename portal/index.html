<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Coyote Portal</title>
<meta name="description" content="What to film and when to post for @elcoyotediesel. Day by day, built from the 30-day plan.">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c;--ink:#141414;--card:#161618;--line:#27272b;--cream:#efe9dc;--muted:#a79f8f;
  --tan:#c9b38c;--ox:#7a1f1f;--oxd:#5a1515;--yellow:#f7d43c;--hi:#e2543e;--green:#2f7a4f;
  --am:#c9b38c;--pm:#e2543e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.5 Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--tan)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
header{padding:20px 0 8px}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:1px;font-size:38px;line-height:1;margin:0}
h1 span{color:var(--tan)}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.strip{display:none}
.pill{background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--cream)}
.pill b{color:var(--yellow);font-weight:600}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(11,11,12,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:9}
nav.tabs button{flex:1;padding:8px 2px;font-size:12px;color:var(--muted);border-radius:10px;letter-spacing:.3px}
nav.tabs button.on{color:var(--yellow);background:var(--ink)}
section.view{display:none;padding-top:8px}
section.view.on{display:block}
h2{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:2px;font-size:15px;color:var(--tan);text-transform:uppercase;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.card.am{border-left:4px solid var(--am)}
.card.pm{border-left:4px solid var(--pm)}
.card.done{opacity:.55}
.slot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
.slot b{color:var(--cream);font-weight:600}
.title{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:26px;line-height:1.1;margin:8px 0 4px;letter-spacing:.3px}
.meta{font-size:13px;color:var(--muted)}
.meta span{color:var(--tan)}
.body{font-size:14px;color:#d8d2c4;margin-top:10px;white-space:pre-wrap}
.cap{margin-top:12px;background:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;border:1px dashed var(--line)}
.cap small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--cream)}
.btn.on{background:var(--ox);border-color:var(--ox);color:#fff}
.btn.ghost{color:var(--tan)}
.steps{margin:6px 0 0;padding-left:18px;font-size:14px;color:#d8d2c4}
.steps li{margin:4px 0}
.check{list-style:none;padding:0;margin:0}
.check li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.check li:last-child{border-bottom:0}
.check input{margin-top:5px;accent-color:var(--yellow);width:18px;height:18px;flex:none}
.check li.ok span{color:var(--muted);text-decoration:line-through}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.day.today{border-color:var(--yellow)}
.day.past{opacity:.6}
.day .d{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px}
.day .d b{color:var(--cream)}
.day .i{font-size:13px;margin-top:6px;line-height:1.3}
.day .i em{font-style:normal;color:var(--am);font-weight:600;font-size:11px;letter-spacing:1px}
.day .i em.pm{color:var(--pm)}
.day .st{display:inline-block;margin-top:6px;font-size:11px;border-radius:6px;padding:1px 6px;background:var(--ink);color:var(--muted)}
.day .st.posted{background:var(--green);color:#fff}
.day .st.shot{background:var(--oxd);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.filters .btn.on{background:var(--tan);border-color:var(--tan);color:#111}
input.search{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--cream);font:inherit;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--tan);font-weight:600;font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.t{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g{color:#7fd09a}.r{color:#f08a7a}.y{color:var(--yellow)}
.tiny{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .v{font-family:Anton,Impact,sans-serif;font-size:30px;line-height:1;color:var(--yellow)}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-top:4px}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.shape{display:inline-block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;border-radius:6px;padding:2px 8px;background:var(--ink);color:var(--tan);border:1px solid var(--line)}
.shape.loop{color:var(--yellow)}.shape.skit{color:#9ad3ff}.shape.story{color:var(--hi)}.shape.question{color:#c6a6ff}
.lane{display:inline-block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;border-radius:6px;padding:2px 8px;background:var(--ink);border:1px solid var(--line);color:var(--cream)}
.lane.funny{color:var(--yellow)}.lane.trust{color:#7fd09a}.lane.relatable{color:var(--tan)}.lane.people{color:#c6a6ff}.lane.chief{color:#9ad3ff}.lane.rival{color:var(--hi)}
.th{margin-top:10px}
.th .kv{font-size:14px;color:#d8d2c4;padding:7px 0;border-top:1px solid var(--line)}
.th .kv small{display:block;color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.film{margin:0;padding:0;list-style:none}
.film li{padding:10px 0;border-bottom:1px solid var(--line)}
.film li:last-child{border-bottom:0}
.film .t{font-family:Anton,Impact,sans-serif;font-size:20px;line-height:1.15;letter-spacing:.3px}
.film .b{font-size:13px;color:var(--muted);margin-top:3px}
.film .b b{color:var(--cream);font-weight:600}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:8px 0}
summary{cursor:pointer;font-weight:600;font-size:15px}
summary .shape{margin-left:8px}
.footer{color:var(--muted);font-size:12px;padding:20px 0}
#gate{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{width:100%;max-width:360px;text-align:center}
#gate h1{font-size:44px;margin-bottom:6px}
#gate p{color:var(--muted);font-size:14px;margin:0 0 18px}
#gate input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--cream);font:600 28px/1 Poppins,sans-serif;text-align:center;letter-spacing:10px;outline:none}
#gate input:focus{border-color:var(--tan)}
#gate .err{color:var(--hi);font-size:13px;height:18px;margin-top:10px}
#gate button{margin-top:12px;width:100%;background:var(--ox);color:#fff;border-radius:14px;padding:14px;font-weight:600;font-size:16px}
/* remaster 2026-11-23: banner, foldable cards, month grid, queue, to do, guide */
.stage{display:flex;align-items:center;gap:12px;background:var(--ink);border:1px solid var(--line);border-top:0;padding:12px 16px;border-radius:0 0 16px 16px}
.stage .light{width:14px;height:14px;border-radius:50%;background:#4ad66d;box-shadow:0 0 12px #4ad66d;flex:none}
.stage b{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:1.5px;font-size:17px;text-transform:uppercase}
.stage small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.stage .sp{margin-left:auto;font-size:12px;border:1px solid var(--tan);color:var(--tan);border-radius:999px;padding:3px 10px;white-space:nowrap}
.card.fold>.fhead{display:flex;align-items:flex-start;gap:12px;cursor:pointer}
.card.fold .fbody{display:none}
.card.fold.open .fbody{display:block}
.card.trialc{border-left:4px solid #9ad3ff}
.num{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:Anton,Impact,sans-serif;font-size:14px;letter-spacing:.5px;background:var(--tan);color:#111}
.num.pm{background:var(--pm);color:#fff}.num.trial{background:#9ad3ff;color:#111;font-size:12px}
.s-shot .num{outline:2px solid #9ad3ff;outline-offset:2px}.s-drive .num,.s-cut .num{outline:2px solid var(--yellow);outline-offset:2px}.s-posted .num{background:var(--green);color:#fff}
.fhead .ft{flex:1;min-width:0}
.fhead .chev{color:var(--muted);margin-top:10px;transition:transform .2s}
.card.fold.open .chev{transform:rotate(180deg)}
.stbadge{display:inline-block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;border-radius:6px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.stbadge.shot{color:#9ad3ff;border-color:#9ad3ff}.stbadge.drive,.stbadge.cut{color:var(--yellow);border-color:var(--yellow)}.stbadge.posted{color:#7fd09a;border-color:#7fd09a}
.btn.go{background:var(--tan);border-color:var(--tan);color:#111;font-weight:600;flex:1;min-width:150px;padding:12px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px 10px;margin:10px 0}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:2px;font-size:18px;text-transform:uppercase}
.cal-head button{border:1px solid var(--line);background:var(--ink);border-radius:10px;width:38px;height:38px;font-size:18px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:4px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mday{min-height:76px;border-radius:9px;background:var(--ink);padding:4px 3px;display:flex;flex-direction:column;gap:2px}
.mday[data-d]{cursor:pointer}
.mday.out{opacity:.25}.mday.today{outline:2px solid var(--yellow);outline-offset:-2px}.mday.sel{outline:2px solid var(--tan);outline-offset:-2px}
.mday .dn{font-size:12px;font-weight:600;color:var(--muted);text-align:center;line-height:1.1}
.chip{border-radius:5px;font-size:10px;font-weight:600;padding:2px 0;text-align:center;line-height:1.2;letter-spacing:.5px;background:var(--tan);color:#111}
.chip.pm{background:var(--pm);color:#fff}.chip.trial{background:#9ad3ff}
.chip.shot{box-shadow:inset 0 0 0 2px #fff}.chip.drive,.chip.cut{box-shadow:inset 0 0 0 2px var(--yellow)}
.chip.posted{background:transparent;color:#7fd09a;box-shadow:inset 0 0 0 1px #7fd09a}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.qrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow .num{width:38px;height:38px;font-size:11px;border-radius:9px}
.qrow .qt{flex:1;min-width:0;font-size:14px;line-height:1.3}
.qrow .qt small{display:block;color:var(--muted);font-size:12px}
.todo{list-style:none;padding:0;margin:0}
.todo li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.todo li:last-child{border-bottom:0}
.todo input[type=checkbox]{margin-top:4px;accent-color:var(--yellow);width:18px;height:18px;flex:none}
.todo li.ok span{color:var(--muted);text-decoration:line-through}
.todo span{flex:1}.todo .x{color:var(--muted);font-size:18px;line-height:1;padding:0 4px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--cream);font:inherit}
.g-loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0}
.g-loop span{background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px}
.g-loop span b{color:var(--yellow);font-weight:600;margin-right:5px}
.g-loop i{color:var(--tan);font-style:normal}
.gnum{font-family:Anton,Impact,sans-serif;font-size:14px;letter-spacing:2px;color:#111;background:var(--tan);border-radius:8px;padding:2px 9px;margin-right:8px}
.ghead{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:22px;letter-spacing:.5px;line-height:1.2;margin:0 0 6px}
.gline{color:var(--yellow);font-size:14px;margin:0 0 6px}
.gp{font-size:14px;color:#d8d2c4;margin:6px 0}
.g5{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}
.g5 div{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px}
.g5 b{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tan)}
.g5 small{display:block;color:var(--muted);font-size:12px;margin:2px 0 6px}
.g5 em{font-style:normal;font-size:13px;color:#d8d2c4}
.ladder{list-style:none;margin:8px 0 0;padding:0}
.ladder li{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:4px auto;font-size:13px;color:#d8d2c4}
.ladder li b{color:var(--tan);letter-spacing:1px;text-transform:uppercase;font-size:12px;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.two>div{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;color:#d8d2c4}
.two .big{font-family:Anton,Impact,sans-serif;font-size:34px;line-height:1;color:var(--yellow)}
.two b{display:block;letter-spacing:1.5px;text-transform:uppercase;font-size:12px;color:var(--tan);margin:4px 0}
.nope{list-style:none;padding:0;margin:6px 0 0}
.nope li{padding:6px 0 6px 24px;position:relative;font-size:14px;border-bottom:1px solid var(--line);color:#d8d2c4}
.nope li:last-child{border-bottom:0}
.nope li::before{content:"×";position:absolute;left:4px;top:3px;color:var(--hi);font-size:18px;line-height:1.2}
.card.pinc{border:1px solid var(--yellow)}
.pscript{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.pscript p{font-size:17px;line-height:1.45;margin:10px 0}
.pcap{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;white-space:pre-wrap;color:#d8d2c4}
.ours{margin-top:10px;border-left:3px solid var(--tan);padding:4px 0 4px 12px;font-size:13px;color:#d8d2c4}
.ours b{color:var(--tan);font-weight:600}

/* ---- Style guide tab (2026-11-23) ---- */
.fx-impact{font-family:Impact,Anton,sans-serif;font-weight:400;text-transform:uppercase;line-height:.92;letter-spacing:.5px}
.fx-round{font-family:'Pinyon Script','Snell Roundhand',cursive;line-height:1}
.fx-brush{font-family:'Permanent Marker',cursive;text-transform:uppercase;line-height:1}
.spec{background:#1c1e20;border:1px solid var(--line);border-radius:14px;padding:18px 14px;margin:10px 0;text-align:center;overflow:hidden}
.spec small{display:block;text-align:left;color:var(--muted);font-size:12px;margin-top:10px;line-height:1.45}
.spec small b{color:var(--tan);font-weight:600}
.lock{position:relative;display:inline-block;padding:6px 0 10px}
.lock .a{display:block;font-size:clamp(38px,11.5vw,80px);color:#FDC43A}
.lock .b{display:block;font-size:clamp(38px,11.5vw,80px);color:#F04625}
.lock .a.gap{margin-bottom:.16em}
.lock .x{position:absolute;left:-4%;right:-4%;top:41%;font-size:clamp(17px,5.2vw,36px);color:#fff;transform:rotate(-4deg) skewX(-8deg);text-shadow:0 3px 0 rgba(0,0,0,.4),0 8px 18px rgba(0,0,0,.5);white-space:nowrap}
.lock .s{display:block;font-size:clamp(30px,8.5vw,54px);color:#FDC43A;margin-bottom:2px}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-top:8px}
.sw div{border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--ink);font-size:12px}
.sw i{display:block;height:54px}
.sw b{display:block;padding:6px 8px 0;font-weight:600}
.sw span{display:block;padding:0 8px 8px;color:var(--muted)}
.zone{position:relative;width:180px;height:320px;margin:10px auto;border-radius:16px;border:2px solid var(--line);background:#222;overflow:hidden;font-size:10px;letter-spacing:.5px;text-transform:uppercase;text-align:center;color:#111}
.zone div{position:absolute;display:grid;place-items:center;font-weight:600}
.zone .z1{left:0;right:0;top:0;height:32.3%;background:rgba(60,190,90,.85)}
.zone .z2{left:0;right:0;top:32.5%;height:2px;background:#7CFF9A}
.zone .z3{left:0;width:79%;top:67.3%;height:14.6%;background:rgba(70,140,255,.85)}
.zone .z4{left:0;right:0;top:81.9%;bottom:0;background:rgba(220,50,40,.85);color:#fff}
.zone .z5{right:0;width:21%;top:33.3%;height:48.6%;background:rgba(220,50,40,.85);color:#fff;writing-mode:vertical-rl}
.zone .ey{left:6px;top:calc(32.5% + 4px);color:#7CFF9A;font-weight:600}
.sgimg{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-top:8px}
.stt{display:inline-block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid;border-radius:999px;padding:2px 10px;margin-bottom:8px}
.stt.ok{color:#7CFF9A;border-color:#2f7a4f}.stt.dr{color:var(--yellow);border-color:var(--yellow)}
.sgl{list-style:none;padding:0;margin:6px 0 0}
.sgl li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;color:#d8d2c4}
.sgl li:last-child{border-bottom:0}
.sgl li b{color:var(--tan);font-weight:600}
@media (max-width:520px){.two{grid-template-columns:1fr}.mday{min-height:66px}nav.tabs button{font-size:10px;padding:8px 1px}}
@media (min-width:720px){h1{font-size:48px}.title{font-size:30px}}

</style>
</head>
<body>
<div id="gate"><form class="box" autocomplete="off"><h1>EL COYOTE <span>portal</span></h1><p>Enter the access code</p><input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autofocus aria-label="access code"><div class="err" id="gerr"></div><button type="submit">Open</button></form></div>
<div class="wrap">
<div class="stage" id="stage"></div>
<header>
  <h1>EL COYOTE <span>portal</span></h1>
  <div class="sub">What to film. When to post. @elcoyotediesel, two talking heads a day.</div>
  <div class="strip" id="strip"></div>
</header>

<section class="view on" id="v-today"></section>
<section class="view" id="v-cal"></section>
<section class="view" id="v-guide"></section>
<section class="view" id="v-style"></section>
<section class="view" id="v-ideas"></section>
<section class="view" id="v-shoot"></section>
<section class="view" id="v-numbers"></section>
<div class="footer" id="foot"></div>
</div>

<nav class="tabs">
  <button data-v="today" class="on">Today</button>
  <button data-v="cal">Calendar</button>
  <button data-v="guide">Guide</button>
  <button data-v="style">Style</button>
  <button data-v="ideas">Ideas</button>
  <button data-v="shoot">Shoot</button>
  <button data-v="numbers">Numbers</button>
</nav>

<script>
(async function(){
// Access gate. The code itself is not in this file, only its SHA-256; the match is remembered on this device.
const HASH = 'f8a3ab4db236acc0a49f3a00f3d0fac16ed93169ffc29827b01215511a3926a7';
async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const gate = document.getElementById('gate');
let ok = false; try { ok = localStorage.getItem('coyote-gate') === HASH; } catch(e){}
if(!ok){
  await new Promise(res=>{
    const f = gate.querySelector('form'), inp = document.getElementById('code'), err = document.getElementById('gerr');
    f.onsubmit = async (e)=>{ e.preventDefault(); if(await sha(inp.value.trim()) === HASH){ try{ localStorage.setItem('coyote-gate', HASH);}catch(x){} res(); } else { err.textContent = 'Not it. Try again.'; inp.value=''; inp.focus(); } };
    inp.focus();
  });
}
gate.remove();
const D = await fetch('data.json?v=' + Date.now()).then(r=>r.json());
const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MT = {timeZone:'America/Denver'};
const todayISO = new Date().toLocaleDateString('en-CA', MT);
const fmtDay = (iso)=>new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const daysBetween = (a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);
const addDays = (iso,n)=>{ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toLocaleDateString('en-CA'); };
const epLabel = (n)=> n>=101 ? ('ep '+(n-100)) : ('idea '+n);

// ---- local state (this phone only): slot status + checklists
let state = {};
try { state = JSON.parse(localStorage.getItem('coyote-portal')||'{}'); } catch(e){ state = {}; }
const save = ()=>{ try{ localStorage.setItem('coyote-portal', JSON.stringify(state)); }catch(e){} };
const key = (r)=>`${r.date}-${r.slot}`;
const STATUS = ['not shot','shot','in drive','cut','posted'];
const ST_LABEL = {'not shot':'To film','shot':'Filmed','in drive':'In Drive, needs a cut','cut':'Cut, ready to post','posted':'Posted'};
const ST_NEXT = {'not shot':['shot','Filmed'],'shot':['in drive','Dropped in Drive'],'in drive':['cut','Cut, ready'],'cut':['posted','Posted']};
const ST_BACK = {'shot':'not shot','in drive':'shot','cut':'in drive','posted':'cut'};
const stCls = (s)=>({'not shot':'','shot':'shot','in drive':'drive','cut':'cut','posted':'posted'}[s]||'');
const stOf = (k)=>STATUS.includes(state[k]) ? state[k] : 'not shot';
state.open = state.open || {};
// trial reels: one a day at lunch. A date with no planned row is a twin of that day's PM episode.
const TR = {}; (D.trials||[]).forEach(t=>{ TR[t.date]=t; });
function trialFor(iso){
  if(TR[iso]) return TR[iso];
  const pm = D.calendar.find(r=>r.date===iso && r.slot==='PM'); if(!pm) return null;
  const i = D.ideas[pm.idea_n] || {title:pm.idea};
  return {date:iso, type:'TWIN', title:'Trial twin: '+i.title, what:'The same PM episode cut with a different first line and first shot. Post it as a trial at lunch; the open with the lower skip rate is the one to keep using.', length:'same as the episode', source:'the same sit, one extra open'};
}

// ---- header strip
const dayN = daysBetween(D.plan_first_date, todayISO) + 1;
const toSema = daysBetween(todayISO, D.sema_date);
$('#strip').innerHTML = `
  <div class="pill">Day <b>${dayN<1?'0':dayN}</b> of 30</div>
  <div class="pill"><b>2</b> talking heads a day</div>
  <div class="pill"><b>${toSema}</b> days to SEMA</div>`;
$('#stage').innerHTML = `<span class="light"></span><div><b>${dayN<1?'Starts '+fmtDay(D.plan_first_date):(dayN>30?'30 days done':'Day '+dayN+' of 30')}</b><small>${esc(D.plan_name||'')} · trial reel at lunch · ranking ${fmtDay(D.ranking_date)}</small></div><span class="sp">${toSema} days to SEMA</span>`;
$('#foot').textContent = `Built ${D.generated_at} MT from the repo. Status marks and to-dos are saved on this device only.`;

// ---- tabs
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('section.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+b.dataset.v));
  window.scrollTo(0,0);
});

// ---- slot card (shared by Today and Calendar)
function thBlock(i, opts){
  let h = `<div class="th"><div class="kv"><small>Open on</small>${esc(i.open)}</div>`;
  if(opts.full){ h += `<div class="kv"><small>The turn</small>${esc(i.turn)}</div><div class="kv"><small>Last line</small>${esc(i.last)}</div>`; }
  h += `<div class="kv"><small>Bring · where</small>${esc(i.device)} · ${esc(i.where)}</div>`;
  h += `<div class="kv"><small>Lockup</small>${esc(i.lockup)}</div>`;
  if(i.splits){ h += `<div class="kv"><small>${opts.full?'Splits the comments':'Last question'}</small>${esc(i.splits)}</div>`; }
  return h + `</div>`;
}
function slotCard(r, opts={}){
  const i = D.ideas[r.idea_n] || {title:r.idea, body:'', cell:r.cell, shape:'story', length:'', caption_line1:''};
  const st = stOf(key(r));
  const sh = D.shapes[i.shape];
  const job = (D.jobs||{})[r.slot];
  const isTH = i.shape==='talk' && i.open;
  const len = isTH ? (i.length_note || (job?job.length:sh.length)) : sh.length;
  const k = key(r); const open = (k in state.open) ? !!state.open[k] : (!!opts.open && st!=="posted"); const nx = ST_NEXT[st], bk = ST_BACK[st];
  return `<div class="card fold ${r.slot.toLowerCase()} s-${stCls(st)} ${open?'open':''} ${st==='posted'?'done':''}" data-k="${k}" id="card-${k}">
    <div class="fhead" data-fold="${k}"><div class="num ${r.slot.toLowerCase()}">${r.slot}</div>
      <div class="ft"><div class="slot"><span>${D.slots[r.slot]}${job&&isTH?` · the <b>${job.job}</b> episode`:''}</span><span>${fmtDay(r.date)} · day ${r.day}</span></div>
      <div class="title">${esc(i.title)}</div>
      <div class="meta">${i.lane?`<span class="lane ${i.lane.toLowerCase()}">${esc(i.lane)}</span> &nbsp;`:''}<span class="shape ${i.shape}">${sh.name}</span> &nbsp;<span>${esc(len)}</span> &nbsp;<span class="stbadge ${stCls(st)}">${ST_LABEL[st]}</span></div></div>
      <div class="chev">▾</div></div>
    <div class="fbody">
    ${isTH ? thBlock(i, {full:true}) : `<div class="body">${esc(i.body||i.frame1||'')}</div>`}
    ${i.caption_line1?`<div class="cap"><small>Caption line 1</small><span id="cap-${k}">${esc(i.caption_line1)}</span></div>`:''}
    </div>
    <div class="row">${nx?`<button class="btn go" data-st="${nx[0]}">${nx[1]} →</button>`:''}${bk?`<button class="btn" data-st="${bk}">↩ back</button>`:''}${i.caption_line1?`<button class="btn ghost" data-copy="${k}">copy caption</button>`:''}<button class="btn ghost" data-open="${r.idea_n}">in Ideas</button></div>
  </div>`;
}
function filmCard(rows, forISO){
  // PM first while the voice is fresh, AM second (playbook/13 section 2)
  const order = [...rows].sort((a,b)=>(a.slot==='PM'?0:1)-(b.slot==='PM'?0:1));
  return `<div class="card"><div class="tiny">One sit in the truck, 30 to 40 minutes, for ${fmtDay(forISO)}. PM first, then AM. Three to five takes each, straight through. Grab what each one needs before you get in.</div><ul class="film">` +
    order.map(r=>{ const i=D.ideas[r.idea_n]||{title:r.idea}; return `<li><div class="t">${r.slot} · ${esc(i.title)}</div><div class="b"><b>Bring:</b> ${esc(i.device||r.device||'')} · <b>where:</b> ${esc(i.where||r.where||'')}${i.length_note?` · ${esc(i.length_note)}`:''}</div>${i.open?`<div class="b"><b>Open on:</b> ${esc(i.open)}</div>`:''}</li>`; }).join('') +
    `</ul></div>`;
}
function trialCard(iso, opts={}){
  const t = trialFor(iso); if(!t) return '';
  const k = iso+'-TRIAL'; const st = stOf(k); const open = (k in state.open) ? !!state.open[k] : !!opts.open; const nx = ST_NEXT[st], bk = ST_BACK[st];
  return `<div class="card fold trialc s-${stCls(st)} ${open?'open':''} ${st==='posted'?'done':''}" data-k="${k}" id="card-${k}">
    <div class="fhead" data-fold="${k}"><div class="num trial">TRIAL</div>
      <div class="ft"><div class="slot"><span>Lunch, 12 to 1 MT · strangers only</span><span>${fmtDay(iso)}</span></div>
      <div class="title">${esc(t.title)}</div>
      <div class="meta"><span class="shape">${esc(t.type)}</span> &nbsp;<span>${esc(t.length)}</span> &nbsp;<span class="stbadge ${stCls(st)}">${ST_LABEL[st]}</span></div></div>
      <div class="chev">▾</div></div>
    <div class="fbody"><div class="th"><div class="kv"><small>What it is</small>${esc(t.what)}</div><div class="kv"><small>Footage</small>${esc(t.source)}</div><div class="kv"><small>When you post it</small>Trial toggle ON, automatic share OFF. Read it tomorrow at lunch: share to everyone at double your usual trial views or 2 percent sends, otherwise leave it.</div></div></div>
    <div class="row">${nx?`<button class="btn go" data-st="${nx[0]}">${nx[1]} →</button>`:''}${bk?`<button class="btn" data-st="${bk}">↩ back</button>`:''}</div>
  </div>`;
}
function wireCards(root){
  root.querySelectorAll('[data-fold]').forEach(h=>h.onclick=()=>{ const k=h.dataset.fold; const c=h.closest('.card'); state.open[k]=!c.classList.contains('open'); save(); c.classList.toggle('open', state.open[k]); });
  root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{ const el=document.getElementById('cap-'+b.dataset.copy); try{ await navigator.clipboard.writeText(el.textContent); b.textContent='copied'; }catch(e){ b.textContent='press and hold the text'; } });
  root.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{
    const k=b.closest('.card').dataset.k; state[k]=b.dataset.st; save(); render();
  });
  root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openIdea(b.dataset.open));
}
function openIdea(n){
  document.querySelector('nav.tabs button[data-v="ideas"]').click();
  const el = document.getElementById('idea-'+n); if(el){ el.open=true; el.scrollIntoView({behavior:'smooth',block:'start'}); }
}

// ---- PINNED: cards at the very top of Today (data/portal/pinned.json), e.g. a partner announcement script
function renderPinned(){
  const list = (D.pinned||[]).filter(p=>!state['pin-done-'+p.id]);
  return list.map(p=>`<div class="card pinc" data-pin="${esc(p.id)}">
    <div class="stbadge" style="color:var(--yellow);border-color:var(--yellow)">${esc(p.tag||'PINNED')}</div>
    <div class="title" style="margin-top:8px">${esc(p.title)}</div>
    ${p.meta?`<div class="tiny" style="margin-top:4px">${esc(p.meta)}</div>`:''}
    ${p.lockup?`<p class="gp"><b style="color:var(--tan)">Title on screen:</b> ${esc(p.lockup)}</p>`:''}
    <p class="gp" style="margin-top:12px"><b style="color:var(--tan)">Say this:</b></p>
    <div class="pscript" id="pin-s-${esc(p.id)}">${(p.script||[]).map(l=>`<p>${esc(l)}</p>`).join('')}</div>
    ${p.shoot?`<p class="gp" style="margin-top:12px"><b style="color:var(--tan)">Filming it:</b></p><ul class="check">${p.shoot.map(l=>`<li><span>${esc(l)}</span></li>`).join('')}</ul>`:''}
    ${p.caption?`<p class="gp" style="margin-top:12px"><b style="color:var(--tan)">Caption:</b></p><div class="pcap" id="pin-c-${esc(p.id)}">${esc(p.caption)}</div>`:''}
    ${p.post?`<p class="gp" style="margin-top:12px"><b style="color:var(--tan)">When you post:</b></p><ul class="check">${p.post.map(l=>`<li><span>${esc(l)}</span></li>`).join('')}</ul>`:''}
    <div class="row" style="margin-top:12px"><button class="btn go" data-pincopy="pin-s-${esc(p.id)}">Copy script</button>${p.caption?`<button class="btn" data-pincopy="pin-c-${esc(p.id)}">Copy caption</button>`:''}<button class="btn ghost" data-pindone="${esc(p.id)}">Posted, take it down</button></div>
  </div>`).join('');
}
function wirePinned(root){
  root.querySelectorAll('[data-pincopy]').forEach(b=>b.onclick=async()=>{ const el=document.getElementById(b.dataset.pincopy); const t=[...el.querySelectorAll('p')].map(x=>x.textContent).join('\n\n') || el.textContent; const was=b.textContent; try{ await navigator.clipboard.writeText(t); b.textContent='copied'; }catch(e){ b.textContent='hold to copy'; } setTimeout(()=>b.textContent=was,1500); });
  root.querySelectorAll('[data-pindone]').forEach(b=>b.onclick=()=>{ state['pin-done-'+b.dataset.pindone]=true; save(); render(); });
}

// ---- TODAY
function renderToday(){
  const rows = D.calendar.filter(r=>r.date===todayISO);
  const tomorrowISO = addDays(todayISO,1);
  const filmISO = dayN<1 ? D.plan_first_date : tomorrowISO;
  const film = D.calendar.filter(r=>r.date===filmISO);
  const next = D.calendar.filter(r=>r.date>filmISO).slice(0,4);
  const due = D.pending.filter(p=>p.status==='due');
  let h = renderPinned();
  if(dayN<1){
    h += `<div class="card"><div class="title">The plan starts ${fmtDay(D.plan_first_date)}: two talking heads a day</div><div class="body">Sixty episodes in thirty days. Every morning a send episode (funny or a list, 20 to 45 s), every afternoon a hold episode (the story, the trust, 40 to 60 s). Tonight: one sit in the truck, both of day 1's episodes. The props are under Film tonight.</div></div>`;
  } else if(!rows.length){
    h += `<div class="card"><div class="title">The 30 days are done</div><div class="body">Rank the four shapes (Funny AM, utility Trust AM, story Trust PM, Relatable PM) by their own grade. January is five a week: PM every weekday, AM on the two days the week-4 data says send. playbook/13 section 6.</div></div>`;
  } else {
    const am = rows.filter(r=>r.slot==='AM'), pm = rows.filter(r=>r.slot!=='AM');
    h += `<h2>Post today</h2>` + am.map(r=>slotCard(r,{open:true})).join('') + trialCard(todayISO) + pm.map(r=>slotCard(r,{open:true})).join('');
  }
  h += renderQueue() + renderTodos();
  if(film.length){ h += `<h2>Film tonight</h2>` + filmCard(film, filmISO); }
  if(due.length){
    h += `<h2>Reads due</h2><div class="card">` + due.map(p=>{
      const late = p.due_iso.slice(0,16) <= new Date().toLocaleString('sv-SE',MT).slice(0,16).replace(' ','T');
      return `<div class="check"><li><span><b>${esc(p.label)}</b><br><span class="tiny">${late?'<span class="y">READ NOW</span>':'due '+esc(p.due_iso.replace('T',' '))+' MT'} · media ${esc(p.media_id)}</span></span></li></div>`;
    }).join('') + `</div>`;
  }
  h += `<h2>Before you post</h2><div class="card"><ul class="check" data-cl="post">` + D.post_checklist.map((t,i)=>`<li class="${state['cl-post-'+i]?'ok':''}"><input type="checkbox" data-i="${i}" ${state['cl-post-'+i]?'checked':''}><span>${esc(t)}</span></li>`).join('') + `</ul><div class="row"><button class="btn ghost" data-reset="post">reset for next post</button></div></div>`;
  if(next.length){ h += `<h2>Coming up</h2>` + next.map(r=>slotCard(r)).join(''); }
  const v=$('#v-today'); v.innerHTML=h; wireCards(v); wireChecks(v,'post'); wireToday(v); wirePinned(v);
}
function renderQueue(){
  const items = [];
  D.calendar.forEach(r=>{ const st=stOf(key(r)); if(st==='shot'||st==='in drive'||st==='cut'){ const i=D.ideas[r.idea_n]||{title:r.idea}; items.push({k:key(r), slot:r.slot, cls:r.slot.toLowerCase(), title:i.title, date:r.date, st}); } });
  Object.keys(state).filter(k=>k.endsWith('-TRIAL')).forEach(k=>{ const st=stOf(k); if(st==='shot'||st==='in drive'||st==='cut'){ const iso=k.slice(0,10); const t=trialFor(iso); if(t) items.push({k, slot:'TRIAL', cls:'trial', title:t.title, date:iso, st}); } });
  const order = {'cut':0,'in drive':1,'shot':2};
  items.sort((a,b)=>order[a.st]-order[b.st] || a.date.localeCompare(b.date));
  let h = `<h2>Queue</h2>`;
  if(!items.length) return h + `<div class="card"><div class="empty" style="padding:0">Nothing waiting. Tap Filmed on a card and it sits here until it is posted.</div></div>`;
  return h + `<div class="card">` + items.map(x=>`<div class="qrow s-${stCls(x.st)}" data-k="${x.k}"><div class="num ${x.cls}">${x.slot}</div><div class="qt">${esc(x.title)}<small>${fmtDay(x.date)} · ${ST_LABEL[x.st]}</small></div><button class="btn go" style="flex:none;min-width:0;padding:8px 12px" data-qst="${ST_NEXT[x.st][0]}">${ST_NEXT[x.st][1]}</button></div>`).join('') + `</div>`;
}
function renderTodos(){
  if(!Array.isArray(state.todos)){ state.todos = [{t:'Check the share screen for the Trial toggle',d:false},{t:'Call Kill Devil Diesel (252) 725-1222, ask for Jared, say Vinny sent you',d:false},{t:'Reply owed: Dennis at Strictly Diesel',d:false}]; save(); }
  const open = state.todos.filter(x=>!x.d).length;
  return `<h2>To do · ${open} open</h2><div class="card"><ul class="todo">` + (state.todos.map((x,i)=>`<li class="${x.d?'ok':''}"><input type="checkbox" data-todo="${i}" ${x.d?'checked':''}><span>${esc(x.t)}</span><button class="x" data-deltodo="${i}" title="remove">×</button></li>`).join('') || '<li><span class="tiny">Nothing on the list.</span></li>') + `</ul><form class="addrow" id="todoForm"><input name="t" placeholder="Add a to do" autocomplete="off"><button class="btn go" style="flex:none;min-width:0" type="submit">Add</button></form></div>`;
}
function wireToday(root){
  root.querySelectorAll('[data-qst]').forEach(b=>b.onclick=()=>{ state[b.closest('.qrow').dataset.k]=b.dataset.qst; save(); render(); });
  root.querySelectorAll('[data-todo]').forEach(c=>c.onchange=()=>{ state.todos[+c.dataset.todo].d=c.checked; save(); render(); });
  root.querySelectorAll('[data-deltodo]').forEach(b=>b.onclick=()=>{ state.todos.splice(+b.dataset.deltodo,1); save(); render(); });
  const fm=root.querySelector('#todoForm'); if(fm) fm.onsubmit=(e)=>{ e.preventDefault(); const t=fm.t.value.trim(); if(t){ state.todos.push({t,d:false}); save(); render(); } };
}
function wireChecks(root,name){
  root.querySelectorAll(`[data-cl="${name}"] input`).forEach(c=>c.onchange=()=>{ state['cl-'+name+'-'+c.dataset.i]=c.checked; save(); render(); });
  root.querySelectorAll(`[data-reset="${name}"]`).forEach(b=>b.onclick=()=>{ Object.keys(state).filter(k=>k.startsWith('cl-'+name+'-')).forEach(k=>delete state[k]); save(); render(); });
}

// ---- CALENDAR
let calM = null, calSel = null;
function renderCal(){
  const byDate = {};
  D.calendar.forEach(r=>{ (byDate[r.date]=byDate[r.date]||[]).push(r); });
  const dates = Object.keys(byDate).sort();
  if(!calM){ const base = (todayISO>=D.plan_first_date && todayISO<=D.plan_last_date) ? todayISO : D.plan_first_date; calM = {y:+base.slice(0,4), m:+base.slice(5,7)-1}; }
  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const first = new Date(calM.y, calM.m, 1); const off = (first.getDay()+6)%7; let cells='';
  const isoOf = (dt)=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  for(let n=0;n<42;n++){
    const dt = new Date(calM.y, calM.m, 1-off+n); const d = isoOf(dt); const rows = (byDate[d]||[]).slice().sort((a,b)=>a.slot.localeCompare(b.slot)); const out = dt.getMonth()!==calM.m;
    const chips = rows.map(r=>`<div class="chip ${r.slot.toLowerCase()} ${stCls(stOf(key(r)))}">${r.slot}</div>`);
    if(rows.length && trialFor(d)) chips.splice(1,0,`<div class="chip trial ${stCls(stOf(d+'-TRIAL'))}">TRIAL</div>`);
    cells += `<div class="mday ${out?'out':''} ${d===todayISO?'today':''} ${d===calSel?'sel':''}" ${rows.length&&!out?`data-d="${d}"`:''}><div class="dn">${dt.getDate()}</div>${chips.join('')}</div>`;
    if(n>=34 && (dt.getDay()+6)%7===6) break;
  }
  let h = `<h2>30 days, two talking heads a day</h2><div class="tiny">AM = the send episode (20 to 45 s, graded on sends). TRIAL = strangers only, at lunch. PM = the hold episode (40 to 60 s, graded on watch share and likes). Tap a day for the briefs. Day 15 (${fmtDay(D.ranking_date)}) ranks the four shapes.</div>
    <div class="cal"><div class="cal-head"><button data-calnav="-1">‹</button><b>${MONTHS[calM.m]} ${calM.y}</b><button data-calnav="1">›</button></div>
    <div class="dow"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div class="mgrid">${cells}</div>
    <div class="legend"><span><i style="background:var(--tan)"></i>AM</span><span><i style="background:#9ad3ff"></i>trial</span><span><i style="background:var(--pm)"></i>PM</span><span><i style="box-shadow:inset 0 0 0 2px var(--yellow)"></i>filmed, waiting</span><span><i style="box-shadow:inset 0 0 0 1px #7fd09a"></i>posted</span></div></div>
    <div id="cal-detail"></div>`;

  const showDay = (d, scroll)=>{ const det=$('#cal-detail'); if(!byDate[d]) return; const rs=byDate[d]; const am=rs.filter(r=>r.slot==='AM'), pm=rs.filter(r=>r.slot!=='AM');
    det.innerHTML = `<h2>${fmtDay(d)}</h2>` + am.map(r=>slotCard(r,{open:true})).join('') + trialCard(d,{open:true}) + pm.map(r=>slotCard(r,{open:true})).join('');
    wireCards(det); if(scroll) det.scrollIntoView({behavior:'smooth',block:'start'}); };
  v.querySelectorAll('.mday[data-d]').forEach(el=>el.onclick=()=>{ calSel=el.dataset.d; renderCal(); showDay(calSel,true); });

}

// ---- NUMBERS
function renderNumbers(){
  const reads = [...D.reads].reverse();
  const seen = new Set(); const latest = reads.filter(r=>!seen.has(r.media_id) && seen.add(r.media_id)).sort((a,b)=>String(b.posted).localeCompare(String(a.posted)));
  const posts = D.posts.filter(p=>p.format==='REELS');
  const med = (a)=>{ const s=a.filter(x=>x!=null&&x!=='').map(Number).sort((x,y)=>x-y); return s.length?s[Math.floor(s.length/2)]:null; };
  const medViews = med(posts.map(p=>p.views)); const medSkip = med(posts.map(p=>p.skip_rate_pct));
  const best = [...posts].sort((a,b)=>Number(b.views)-Number(a.views))[0];
  let h = `<div class="kpis">
    <div class="kpi"><div class="v">${medViews??'-'}</div><div class="l">median views, last 40 reels</div></div>
    <div class="kpi"><div class="v">${medSkip??'-'}%</div><div class="l">median skip</div></div>
    <div class="kpi"><div class="v">${best?Number(best.views).toLocaleString():'-'}</div><div class="l">best reel views</div></div>
    <div class="kpi"><div class="v">${latest.filter(r=>r.grade==='GOAL').length}</div><div class="l">reels at goal (2% sends)</div></div>
  </div>`;
  h += `<h2>Latest reads</h2><div class="tiny">Sends per reach at 48 h is the early warning (floor 1, goal 2). Views at 7 days is the judge (100k candidate, 1M goal). Skip under 45.</div>`;
  if(!latest.length){ h += `<div class="empty">No graded pulls yet. Run coyote.py grade &lt;json&gt; --log, then rebuild.</div>`; }
  else {
    h += `<div style="overflow:auto"><table><tr><th>posted</th><th>reel</th><th>views</th><th>reach</th><th>sends/reach</th><th>skip</th><th>grade</th></tr>` +
      latest.slice(0,25).map(r=>{
        const spr = r.sends_per_reach_pct===''?null:Number(r.sends_per_reach_pct);
        const gcls = r.grade==='GOAL'?'g':r.grade==='MISS'?'r':'';
        return `<tr><td class="n">${esc(String(r.posted).slice(0,10))}</td><td class="t" title="${esc(r.label)}">${esc(r.label)}</td><td class="n">${Number(r.views).toLocaleString()}</td><td class="n">${Number(r.reach).toLocaleString()}</td><td class="n ${spr==null?'':spr>=2?'g':spr>=1?'y':'r'}">${spr==null?'-':spr+'%'}</td><td class="n ${Number(r.skip_pct)>45?'r':'g'}">${r.skip_pct===''?'-':r.skip_pct+'%'}</td><td class="${gcls}">${esc(r.grade)}</td></tr>`;
      }).join('') + `</table></div>`;
  }
  h += `<h2>What the numbers keep saying</h2><div class="card"><ol class="steps">
    <li>Memes and skits get sent (Safety Reminder 2.2%, the 10 mil meme 4.9%). Build updates and shout-outs do not (0 to 0.1%), and they open at 66 to 75% skip.</li>
    <li>Harley Trade held viewers (38% skip, 59% watch) and got one share: the hook is fixed, the caption was about Jacob, not the viewer's people.</li>
    <li>Under 1% sends means the format failed, not the footage. Change who it is for and caption line 1, then reshoot.</li>
    <li>A post on its way to a million shows sends over 1% or watch over 60% at 48 h. Under both, log it and move on.</li>
  </ol></div>`;
  $('#v-numbers').innerHTML = h;
}

      <li><b>It still has to read.</b> First and last letters stay clear of your head. If the word cannot be read behind you, it moves or goes on one line.</li>
      <li><b>The small line stays in front</b> only when it sits in clear space.</li>
      <li><b>Captions and beat words:</b> off your face, always.</li>
    </ul>
  </div>

  <h2>Colours</h2>
  <div class="card">${ok}
    <div class="sw">
      <div><i style="background:#FDC43A"></i><b>Yellow</b><span>#FDC43A · first line, the classy line</span></div>
      <div><i style="background:#F04625"></i><b>Red</b><span>#F04625 · second line</span></div>
      <div><i style="background:#FFFFFF"></i><b>White</b><span>#FFFFFF · painted word, captions</span></div>
      <div><i style="background:#C9B38C"></i><b>Coyote tan</b><span>#C9B38C · site and labels only</span></div>
      <div><i style="background:#0B0B0C"></i><b>Black</b><span>#0B0B0C · cards, backgrounds</span></div>
    </div>
    <p class="gp">Yellow, red and white are measured off the reel you sent. A soft dark shadow under the letters, no outline.</p>
  </div>

  <h2>Where things go on the screen</h2>
  <div class="card">${dr}
    <div class="zone"><div class="z1">Title here, big</div><div class="z2"></div><div class="ey" style="position:absolute">eyes on this line</div><div class="z3">Captions</div><div class="z5">buttons</div><div class="z4">name + caption cover this</div></div>
    <ul class="sgl">
      <li><b>Title:</b> top third of the screen. It is the only thing a muted viewer reads.</li>
      <li><b>Your eyes:</b> on the line a third of the way down, in every shot. Today they sit a little low.</li>
      <li><b>Captions:</b> lower third, pushed a little left so the like and share buttons do not cover them.</li>
      <li><b>Bottom strip:</b> nothing. Instagram covers it with your name and caption.</li>
    </ul>
  </div>

  <h2>Captions</h2>
  <div class="card">${dr}
    <ul class="sgl">
      <li><b>Font:</b> Poppins, white, small, a few words at a time. Soft shadow. No outline, no box, no word-by-word highlight.</li>
      <li><b>Timing:</b> matched to the cut, not the raw clip.</li>
      <li>The reel you sent uses a bold serif for captions. Say the word and I will switch yours to match.</li>
    </ul>
  </div>

  <h2>The rest of the look</h2>
  <div class="card">${dr}
    <ul class="sgl">
      <li><b>Picture:</b> your footage left natural. No colour grade.</li>
      <li><b>Cuts:</b> hard cuts on breaths. The whole message stays in. Under a minute.</li>
      <li><b>Camera:</b> wide, then punched in on the next sentence, with a slow push inside each shot.</li>
      <li><b>Graphics:</b> one device per reel at most (a checklist, a card, beat words).</li>
      <li><b>Sound:</b> your voice. The song goes on inside Instagram unless you ask for it baked in.</li>
    </ul>
  </div>

  <h2>Never</h2>
  <div class="card"><ul class="nope">
    <li>Text over your face.</li>
    <li>The yellow script over white block title (you called it "the worst").</li>
    <li>Outlined letters, caption bars, word-by-word highlights.</li>
    <li>A call to action, outro or handle card on screen.</li>
    <li>Colour grades or added saturation.</li>
    <li>Elite Diesel, 307 or shop people in an El Coyote video.</li>
  </ul></div>`;
  $('#v-style').innerHTML = h;
}
